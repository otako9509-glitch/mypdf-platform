<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل ملف PDF - MyPDF</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f4f5f8; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* شريط الأدوات العلوي */
        .top-navbar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 24px;
            height: 60px;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .nav-brand { font-size: 22px; font-weight: 800; color: #e5322d; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .main-tools-bar { display: flex; align-items: center; gap: 8px; }
        .tool-action-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            color: #4a5568;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tool-action-btn:hover { background: #f1f5f9; color: #000; }
        .tool-action-btn.active { background: #fee2e2; color: #e5322d; border-color: #fca5a5; }

        /* شريط تنسيق الخط */
        .text-properties-bar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 6px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
        .prop-select, .prop-input {
            border: 1px solid #cbd5e1;
            padding: 5px 10px;
            border-radius: 6px;
            outline: none;
            background: #fff;
            color: #334155;
            font-size: 13px;
        }
        .prop-btn {
            background: transparent;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .prop-btn.active { background: #e2e8f0; border-color: #94a3b8; }

        /* مساحة العمل */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .left-sidebar {
            width: 280px;
            background: #ffffff;
            border-left: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
            z-index: 10;
        }
        .sidebar-title { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 12px; }
        .elements-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .element-row {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }
        .element-row .del-btn { color: #94a3b8; cursor: pointer; }
        .element-row .del-btn:hover { color: #ef4444; }

        .btn-save-red {
            background: #e5322d;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(229, 50, 45, 0.3);
        }
        .btn-save-red:hover { background: #cc2420; }

        .pdf-viewer-area {
            flex: 1;
            overflow: auto;
            background: #525659;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            gap: 20px;
        }
        .page-canvas-wrapper {
            position: relative;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .canvas-overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            cursor: default;
        }

        /* كائن قابل للتحريك وإعادة التحجيم مثل Word */
        .interactive-box {
            position: absolute;
            border: 1.5px dashed #2563eb;
            user-select: none;
            cursor: move;
            z-index: 50;
            display: inline-block;
        }
        .interactive-box.selected {
            border-style: solid;
            border-color: #e5322d;
        }

        .text-inner-content {
            outline: none;
            background: rgba(255, 255, 255, 0.85);
            padding: 2px 6px;
            min-width: 40px;
            display: inline-block;
        }

        .image-inner-content {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        /* مقبض تغيير الحجم للصور والعناصر */
        .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffffff;
            border: 2px solid #e5322d;
            border-radius: 50%;
            bottom: -5px;
            right: -5px;
            cursor: se-resize;
            z-index: 60;
        }

        /* اللوحة الجانبية اليمنى للصفحات */
        .right-thumbnails-panel {
            width: 140px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            overflow-y: auto;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .thumb-box {
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .thumb-box.active { border-color: #e5322d; }
        .thumb-box canvas { display: block; max-width: 100px; height: auto; }
        .thumb-page-num { font-size: 12px; font-weight: 600; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>

    <header class="top-navbar">
        <a href="../index.html" class="nav-brand">
            <i class="fa-solid fa-file-pdf"></i> MyPDF
        </a>

        <div class="main-tools-bar">
            <button class="tool-action-btn active" id="btnHand" onclick="setActiveTool('hand')" title="تحديد وتحريك">
                <i class="fa-solid fa-arrow-pointer"></i> تحديد
            </button>
            <button class="tool-action-btn" id="btnText" onclick="setActiveTool('text')" title="إضافة نص">
                <i class="fa-solid fa-font"></i> كتابة نص
            </button>
            <button class="tool-action-btn" onclick="document.getElementById('imgFile').click()" title="إضافة صورة">
                <i class="fa-solid fa-image"></i> صورة
            </button>
            <button class="tool-action-btn" id="btnEraser" onclick="setActiveTool('eraser')" title="مسح وتغطية">
                <i class="fa-solid fa-eraser"></i> ممحاة
            </button>
            <input type="file" id="imgFile" accept="image/*" style="display: none;" onchange="handleImageAdd(event)">
        </div>

        <a href="../index.html" class="tool-action-btn">
            <i class="fa-solid fa-xmark"></i> خروج
        </a>
    </header>

    <div class="text-properties-bar">
        <select id="fontSize" class="prop-select">
            <option value="14">14 pt</option>
            <option value="16" selected>16 pt</option>
            <option value="20">20 pt</option>
            <option value="28">28 pt</option>
            <option value="36">36 pt</option>
        </select>
        <button class="prop-btn" id="boldBtn" onclick="toggleBold()">B</button>
        <input type="color" id="textColor" class="prop-input" style="padding: 1px; width: 34px; height: 32px;" value="#000000">
    </div>

    <div class="workspace">
        <div class="left-sidebar">
            <div>
                <h3 class="sidebar-title">العناصر المعدلة</h3>
                <div class="elements-list" id="addedItemsList"></div>
            </div>

            <button class="btn-save-red" id="saveFinalBtn" onclick="saveAndProcessPDF()">
                حفظ التغييرات <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>

        <div class="pdf-viewer-area" id="pdfScrollContainer">
            <p id="waitText" style="color: #fff; margin-top: 50px;">جاري تحميل صفحات المستند...</p>
        </div>

        <div class="right-thumbnails-panel" id="thumbsPanel"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let currentTool = 'hand';
        let isBold = false;
        let pdfInstance = null;
        let scaleRatio = 1.25;
        let editsList = [];
        let elementCounter = 1;
        let activeSelectedEl = null;

        function setActiveTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-action-btn').forEach(b => b.classList.remove('active'));
            if(tool === 'hand') document.getElementById('btnHand').classList.add('active');
            if(tool === 'text') document.getElementById('btnText').classList.add('active');
            if(tool === 'eraser') document.getElementById('btnEraser').classList.add('active');
        }

        function toggleBold() {
            isBold = !isBold;
            document.getElementById('boldBtn').classList.toggle('active', isBold);
            if (activeSelectedEl && activeSelectedEl.dataset.type === 'text') {
                const inner = activeSelectedEl.querySelector('.text-inner-content');
                inner.style.fontWeight = isBold ? 'bold' : 'normal';
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const pdfBase64 = sessionStorage.getItem('pdf_to_edit');
            if (!pdfBase64) {
                document.getElementById('waitText').innerText = 'لم يتم اختيار ملف. الرجاء العودة والبدء من جديد.';
                return;
            }

            try {
                pdfInstance = await pdfjsLib.getDocument(pdfBase64).promise;
                document.getElementById('waitText').remove();

                for (let i = 1; i <= pdfInstance.numPages; i++) {
                    const page = await pdfInstance.getPage(i);
                    const viewport = page.getViewport({ scale: scaleRatio });

                    const pageWrapper = document.createElement('div');
                    pageWrapper.className = 'page-canvas-wrapper';
                    pageWrapper.id = `page-wrap-${i}`;
                    pageWrapper.style.width = `${viewport.width}px`;
                    pageWrapper.style.height = `${viewport.height}px`;

                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;

                    const overlay = document.createElement('div');
                    overlay.className = 'canvas-overlay-layer';
                    overlay.dataset.page = i;
                    setupPageInteraction(overlay, i);

                    pageWrapper.appendChild(canvas);
                    pageWrapper.appendChild(overlay);
                    document.getElementById('pdfScrollContainer').appendChild(pageWrapper);

                    generateThumbnail(page, i);
                }
            } catch (err) {
                document.getElementById('waitText').innerText = 'تعذر قراءة الملف: ' + err.message;
            }
        });

        async function generateThumbnail(page, pageNum) {
            const thumbViewport = page.getViewport({ scale: 0.18 });
            const thumbBox = document.createElement('div');
            thumbBox.className = `thumb-box ${pageNum === 1 ? 'active' : ''}`;
            thumbBox.onclick = () => {
                document.querySelectorAll('.thumb-box').forEach(b => b.classList.remove('active'));
                thumbBox.classList.add('active');
                document.getElementById(`page-wrap-${pageNum}`).scrollIntoView({ behavior: 'smooth' });
            };

            const tCanvas = document.createElement('canvas');
            tCanvas.width = thumbViewport.width;
            tCanvas.height = thumbViewport.height;
            await page.render({ canvasContext: tCanvas.getContext('2d'), viewport: thumbViewport }).promise;

            const label = document.createElement('div');
            label.className = 'thumb-page-num';
            label.innerText = pageNum;

            thumbBox.appendChild(tCanvas);
            thumbBox.appendChild(label);
            document.getElementById('thumbsPanel').appendChild(thumbBox);
        }

        function setupPageInteraction(overlay, pageNum) {
            overlay.addEventListener('click', (e) => {
                if (currentTool !== 'text' || e.target !== overlay) return;
                const rect = overlay.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const fontSz = document.getElementById('fontSize').value;
                const colorVal = document.getElementById('textColor').value;
                const itemId = 'item_' + Date.now();
                const defaultText = 'أدخل النص هنا';

                const box = document.createElement('div');
                box.className = 'interactive-box selected';
                box.id = itemId;
                box.dataset.type = 'text';
                box.style.left = `${x}px`;
                box.style.top = `${y}px`;

                const inner = document.createElement('div');
                inner.className = 'text-inner-content';
                inner.contentEditable = 'true';
                inner.innerText = defaultText;
                inner.style.fontSize = `${fontSz}px`;
                inner.style.color = colorVal;
                if (isBold) inner.style.fontWeight = 'bold';

                box.appendChild(inner);
                overlay.appendChild(box);

                selectElement(box);
                makeInteractive(box, pageNum);
                addToLeftPanel(itemId, defaultText, pageNum);

                editsList.push({
                    id: itemId,
                    type: 'text',
                    page: pageNum,
                    x: x / scaleRatio,
                    y: y / scaleRatio,
                    text: defaultText,
                    fontSize: parseInt(fontSz),
                    color: colorVal
                });

                inner.focus();
                inner.oninput = () => {
                    const item = editsList.find(i => i.id === itemId);
                    if (item) item.text = inner.innerText;
                };

                setActiveTool('hand');
            });
        }

        function selectElement(el) {
            if (activeSelectedEl) activeSelectedEl.classList.remove('selected');
            activeSelectedEl = el;
            if (el) el.classList.add('selected');
        }

        function makeInteractive(box, pageNum) {
            // سحب وتغيير مكان العنصر
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            box.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('resize-handle') || e.target.contentEditable === 'true') return;
                selectElement(box);
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = box.offsetLeft;
                initialTop = box.offsetTop;

                const onMouseMove = (moveEvt) => {
                    if (!isDragging) return;
                    const dx = moveEvt.clientX - startX;
                    const dy = moveEvt.clientY - startY;
                    box.style.left = `${initialLeft + dx}px`;
                    box.style.top = `${initialTop + dy}px`;
                };

                const onMouseUp = () => {
                    isDragging = false;
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);

                    const found = editsList.find(i => i.id === box.id);
                    if (found) {
                        found.x = box.offsetLeft / scaleRatio;
                        found.y = box.offsetTop / scaleRatio;
                    }
                };

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            });

            // تغيير حجم الصورة بواسطة المقبض
            const handle = box.querySelector('.resize-handle');
            if (handle) {
                handle.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    let startW = box.offsetWidth;
                    let startX = e.clientX;

                    const onResize = (ev) => {
                        const newWidth = Math.max(40, startW + (ev.clientX - startX));
                        box.style.width = `${newWidth}px`;
                    };

                    const onStopResize = () => {
                        window.removeEventListener('mousemove', onResize);
                        window.removeEventListener('mouseup', onStopResize);

                        const found = editsList.find(i => i.id === box.id);
                        if (found) {
                            found.width = box.offsetWidth / scaleRatio;
                        }
                    };

                    window.addEventListener('mousemove', onResize);
                    window.addEventListener('mouseup', onStopResize);
                });
            }
        }

        function handleImageAdd(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const itemId = 'img_' + Date.now();
                const box = document.createElement('div');
                box.className = 'interactive-box selected';
                box.id = itemId;
                box.dataset.type = 'image';
                box.style.left = '60px';
                box.style.top = '60px';
                box.style.width = '140px';

                const img = document.createElement('img');
                img.src = evt.target.result;
                img.className = 'image-inner-content';

                const handle = document.createElement('div');
                handle.className = 'resize-handle';

                box.appendChild(img);
                box.appendChild(handle);

                const firstOverlay = document.querySelector('.canvas-overlay-layer');
                if (firstOverlay) {
                    firstOverlay.appendChild(box);
                    selectElement(box);
                    makeInteractive(box, 1);
                    addToLeftPanel(itemId, 'صورة مضافة', 1);

                    editsList.push({
                        id: itemId,
                        type: 'image',
                        page: 1,
                        x: 60 / scaleRatio,
                        y: 60 / scaleRatio,
                        width: 140 / scaleRatio,
                        imageData: evt.target.result
                    });
                }
            };
            reader.readAsDataURL(file);
        }

        function addToLeftPanel(id, text, pageNum) {
            const row = document.createElement('div');
            row.className = 'element-row';
            row.id = `row_${id}`;
            row.innerHTML = `
                <span>${text} (صفحة ${pageNum})</span>
                <i class="fa-solid fa-trash del-btn" onclick="removeItem('${id}')"></i>
            `;
            document.getElementById('addedItemsList').appendChild(row);
        }

        function removeItem(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
            const row = document.getElementById(`row_${id}`);
            if (row) row.remove();
            editsList = editsList.filter(i => i.id !== id);
        }

        async function saveAndProcessPDF() {
            const saveBtn = document.getElementById('saveFinalBtn');
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ والتصدير...';
            saveBtn.disabled = true;

            const rawPdf = sessionStorage.getItem('pdf_to_edit');
            const pdfName = sessionStorage.getItem('pdf_name') || 'document.pdf';

            try {
                const res = await fetch(rawPdf);
                const blob = await res.blob();
                const file = new File([blob], pdfName, { type: 'application/pdf' });

                const formData = new FormData();
                formData.append('files', file);
                formData.append('operation', 'edit');
                formData.append('edits_data', JSON.stringify(editsList));

                const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                    ? 'http://127.0.0.1:8080/api/v1'
                    : 'https://mypdf-platform.onrender.com/api/v1';

                const upRes = await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
                const upData = await upRes.json();

                if (upRes.ok && upData.success) {
                    const timer = setInterval(async () => {
                        const jRes = await fetch(`${API_URL}/jobs/${encodeURIComponent(upData.job_id)}`);
                        const jData = await jRes.json();
                        if (jData.success && jData.job.status === 'COMPLETED') {
                            clearInterval(timer);
                            window.location.href = `${API_URL}/download/${encodeURIComponent(jData.job.job_id)}/${encodeURIComponent(jData.job.output_file)}`;
                            saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> اكتمل التحميل!';
                            saveBtn.disabled = false;
                        } else if (jData.job.status === 'FAILED') {
                            clearInterval(timer);
                            alert('حدث خطأ أثناء المعالجة: ' + jData.job.error);
                            saveBtn.innerHTML = 'حفظ التغييرات <i class="fa-solid fa-arrow-left"></i>';
                            saveBtn.disabled = false;
                        }
                    }, 1500);
                } else {
                    alert('فشل الرفع: ' + (upData.detail || ''));
                    saveBtn.innerHTML = 'حفظ التغييرات <i class="fa-solid fa-arrow-left"></i>';
                    saveBtn.disabled = false;
                }
            } catch (err) {
                alert('تعذر الاتصال بالخادم: ' + err.message);
                saveBtn.innerHTML = 'حفظ التغييرات <i class="fa-solid fa-arrow-left"></i>';
                saveBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
